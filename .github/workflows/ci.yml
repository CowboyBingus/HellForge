# The checks every pull request into dev or main must pass (CONTRIBUTING.md, "Branches and pull requests"): the
# structure lint (scripts/lint/README.md), the engine version check, the build (warnings are errors) and the checks
# that need no game, as scripts/Test.ps1 runs them. The engine and the in-game editor build and test on a maintainer's PC: they need the
# game's files, the Steamworks SDK and a GPU.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Structure lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # the oldest the lint supports (scripts/lint/README.md)
      - name: The lint's own tests
        run: python -m unittest discover -s scripts/lint/tests -v
      # fails on an error rule's violation (R12-R14) that scripts/lint/lint-baseline.json does not have; a new R10, R11 or
      # R15 one and a known one that grew only warn (scripts/lint/README.md, "The baseline")
      - name: scripts/lint/lint.py check
        run: python scripts/lint/lint.py check

  # Whether the engine changed since the commit that set EngineVersion (scripts/engine-version/engine_version.py,
  # CONTRIBUTING.md "The engine's version"): a warning on an ordinary pull request, a failure on a version-bump pull
  # request or a release (into main) whose engine changed without a bump.
  engine-version:
    name: Engine version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: the commit that set EngineVersion, and the pull request's base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: The check's own tests
        run: python -m unittest discover -s scripts/engine-version/tests -v
      - name: scripts/engine-version/engine_version.py
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            release=""; if [ "$BASE_REF" = "main" ]; then release="--release"; fi
            python scripts/engine-version/engine_version.py --base "origin/$BASE_REF" $release
          else
            python scripts/engine-version/engine_version.py
          fi

  test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: scripts/Test.ps1 (build, HellForge.Tests, HellForge.LocalBackend.Tests, the CLI's path checks)
        shell: pwsh
        run: |
          # the tests' temporary files inside the workspace, as on a developer's PC (artifacts/ is ignored)
          $env:TEMP = $env:TMP = (New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'artifacts/tmp')).FullName
          ./scripts/Test.ps1
          # Test.ps1 throws on any failure; its last checks expect the CLI to refuse (exit code 1), which the step's own
          # "exit $LASTEXITCODE" would otherwise report
          exit 0
