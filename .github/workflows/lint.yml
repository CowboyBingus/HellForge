# The structure lint (scripts/lint/README.md): its own tests, then `check` against the committed baseline. A pull
# request that adds a violation, or makes a known one worse, fails here.
name: Lint

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Structure lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Lint tests
        run: python -m unittest discover -s scripts/lint/tests -v
      - name: Check
        run: python scripts/lint/lint.py check
